name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Dummy values so pydantic-settings doesn't fail on missing fields
          STRAVA_CLIENT_ID: "test"
          STRAVA_CLIENT_SECRET: "test"
          STRAVA_REFRESH_TOKEN: "test"
          OPENAI_API_KEY: "test"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/strava_chat"
        run: pytest tests/ -v --tb=short
